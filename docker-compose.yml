networks:
  cargo_internal:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: cargo_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - cargo_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Необхідно вказати POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Необхідно вказати POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Необхідно вказати POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: cargo_redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - cargo_internal
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:?Необхідно вказати REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
    container_name: cargo_engine
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    networks:
      - cargo_internal
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?Необхідно вказати TELEGRAM_BOT_TOKEN}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: ./bot
    container_name: cargo_bot
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - cargo_internal
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?Необхідно вказати TELEGRAM_BOT_TOKEN}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scraper:
    build:
      context: ./scraper
    container_name: cargo_scraper
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - cargo_internal
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEBUG_DEDUP=${DEBUG_DEDUP:-0}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data: